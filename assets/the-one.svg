<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The One — Order and Chaos in perfect harmony">
  <defs>
    <linearGradient id="one" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f4ff"/>
      <stop offset="0.5" stop-color="#9db8d4"/>
      <stop offset="1" stop-color="#2b1a3a"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#4a3a66"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#050208"/>
  <circle cx="600" cy="305" r="290" fill="url(#halo)" opacity="0.10" filter="url(#soft)"/>
  <circle cx="600" cy="305" r="205" fill="none" stroke="#9db8d4" stroke-width="3" opacity="0.5"/>
  <circle cx="600" cy="305" r="205" fill="none" stroke="#9db8d4" stroke-width="1" opacity="0.3" transform="rotate(60 600 305)"/>

  <!-- the split: one circle, cut into two halves -->
  <path d="M600 305 A205 205 0 0 1 600 100" fill="none" stroke="#e6f4ff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M600 305 A205 205 0 0 1 600 510" fill="none" stroke="#2b1a3a" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <line x1="600" y1="100" x2="600" y2="510" stroke="#9db8d4" stroke-width="2" opacity="0.6"/>

  <text x="600" y="330" text-anchor="middle" dominant-baseline="middle"
        font-family="ui-monospace,Menlo,monospace" font-size="64"
        fill="url(#one)" filter="url(#glow)">THE ONE</text>

  <text x="600" y="78" text-anchor="middle" font-family="ui-monospace,Menlo,monospace"
        font-size="24" letter-spacing="16" fill="#e6f4ff">BEFORE TIME · ORDER ⊗ CHAOS</text>
  <text x="600" y="540" text-anchor="middle" font-family="ui-monospace,Menlo,monospace"
        font-size="17" letter-spacing="5" fill="#9db8d4" opacity="0.9">emanation → resolve → return to enlighten</text>

  <text x="600" y="590" text-anchor="middle" font-family="ui-monospace,Menlo,monospace"
        font-size="14" letter-spacing="10" fill="#5a4a72">THE PRIMAL ARCHITECTURE · 0 + 1 · 全</text>
</svg>
